name: promote-environment
run-name: promote-environment ${{ inputs.operation_type }} ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      activation_api_url:
        required: true
        type: string
      operation_type:
        required: false
        default: promocao
        type: choice
        options: [promocao, rollback]

concurrency:
  group: oon-promote-${{ inputs.release_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lease_id: ${{ steps.context.outputs.lease_id }}
      operation_id: ${{ steps.context.outputs.operation_id }}
      generation: ${{ steps.context.outputs.generation }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Validar endpoint da Central
        shell: bash
        env:
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
        run: |
          set -euo pipefail
          # Mesma lista de hosts do request-dev.yml. A URL recebe o token OIDC do
          # executor e os callbacks de estado: cada uma das três Centrais promove
          # os Apps do próprio ecossistema (ADR 0010 do oon-k8s-infra).
          python3 - "$ACTIVATION_API_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit

          raw = sys.argv[1]
          if raw != raw.strip() or any(ord(ch) < 33 or ord(ch) == 127 for ch in raw):
              raise SystemExit("activation_api_url não pode conter espaços ou caracteres de controle.")
          parsed = urlsplit(raw)
          allowed_hosts = {"central-ativacao.oonapps.online", "central-ativacao-hml.oonapps.online", "central-ativacao-dev.oonapps.online"}
          if parsed.scheme != "https":
              raise SystemExit("activation_api_url deve usar HTTPS.")
          if parsed.hostname not in allowed_hosts:
              raise SystemExit("activation_api_url aponta para hostname não autorizado.")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("activation_api_url não pode conter credenciais, query ou fragment.")
          if parsed.port not in (None, 443):
              raise SystemExit("activation_api_url deve usar a porta HTTPS padrão.")
          if parsed.path.rstrip("/") != "/api":
              raise SystemExit("activation_api_url deve terminar em /api.")
          PY

      - name: Gerar token do Oon Control Plane
        id: control-plane-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OON_CONTROL_PLANE_APP_ID }}
          private-key: ${{ secrets.OON_CONTROL_PLANE_APP_PRIVATE_KEY }}
          owner: oondemand
          repositories: central-ativacao

      - name: Obter executor confiável
        uses: actions/checkout@v5
        with:
          repository: oondemand/central-ativacao
          token: ${{ steps.control-plane-token.outputs.token }}
          ref: main
          path: executor
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: azure/setup-kubectl@v5

      - name: Instalar runtime oficial
        working-directory: executor
        run: bash scripts/actions/install-core.sh backend

      - name: Emitir identidade OIDC do executor
        shell: bash
        env:
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
        run: |
          set -euo pipefail
          separator='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && separator='&'
          audience="$(printf '%s' "$ACTIVATION_API_URL" | jq -sRr @uri)"
          identity="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${audience}")"
          token="$(jq -er '.value | strings | select(length > 0)' <<<"$identity")"
          echo "::add-mask::$token"
          printf 'OON_DELIVERY_SHARED_SECRET=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Obter contexto canônico sem reconstruir
        id: context
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
          EXPECTED_OPERATION_TYPE: ${{ inputs.operation_type }}
        run: |
          node executor/backend/node_modules/@oondemand/oon-core-back/bin/delivery.js context             --release "$RELEASE_ID"             --api "$ACTIVATION_API_URL"             --phase deploy             --output "$RUNNER_TEMP/context.json"

          image_digest="$(jq -er '.imageDigest | strings | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/context.json")"
          operation_type="$(jq -r '.operationType // empty' "$RUNNER_TEMP/context.json")"
          lifecycle_mode="$(jq -r '.lifecycleMode // "tenant_activation"' "$RUNNER_TEMP/context.json")"
          deployment_id="$(jq -r '.deploymentId // empty' "$RUNNER_TEMP/context.json")"
          deployment_token="$(jq -r '.deploymentToken // empty' "$RUNNER_TEMP/context.json")"
          test "$operation_type" = "$EXPECTED_OPERATION_TYPE"
          if [[ "$lifecycle_mode" == "global_singleton" || "$lifecycle_mode" == "platform_shared" ]]; then
            test -n "$deployment_id"
            test -n "$deployment_token"
            echo "::add-mask::$deployment_token"
          else
            test -z "$deployment_id"
            test -z "$deployment_token"
          fi
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          jq -r '"lease_id=\(.leaseId // "")", "operation_id=\(.operationId // "")", "generation=\(.generation // "")"' "$RUNNER_TEMP/context.json" >> "$GITHUB_OUTPUT"

      - name: Registrar promoção do digest existente
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
        run: |
          node executor/scripts/actions/publication-state.js --context "$RUNNER_TEMP/context.json"             --release "$RELEASE_ID"             --api "$ACTIVATION_API_URL"             --state promovendo             --image-digest "$IMAGE_DIGEST"

      - name: Preparar identidade Kubernetes do publisher
        env:
          PUBLISHER_KUBECONFIG_B64: ${{ secrets.PUBLISHER_KUBECONFIG_B64 }}
        run: bash executor/scripts/actions/prepare-publisher-kubeconfig.sh

      - name: Aplicar exatamente o mesmo digest
        working-directory: executor
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
        run: |
          node scripts/actions/deploy-central-dev.js             --release "$RELEASE_ID"             --api "$ACTIVATION_API_URL"             --context "$RUNNER_TEMP/context.json"             --image-digest "$IMAGE_DIGEST"

      - name: Resumo auditável
        if: success()
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION_TYPE: ${{ inputs.operation_type }}
        run: |
          # Aspas simples no formato: crase dentro de aspas duplas é substituição
          # de comando no bash e executaria o valor em vez de exibi-lo.
          {
            echo "## Promoção concluída"
            echo
            printf -- '- Release: `%s`\n' "$RELEASE_ID"
            printf -- '- Operação: `%s`\n' "$OPERATION_TYPE"
            printf -- '- Ambiente: `%s`\n' "$(jq -r '.environment' "$RUNNER_TEMP/context.json")"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Rebuild: `%s`\n' 'não'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: rm -f "$RUNNER_TEMP/context.json" "$RUNNER_TEMP/kubeconfig"

  report-failure:
    needs: promote
    if: ${{ always() && needs.promote.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validar endpoint da Central
        shell: bash
        env:
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
        run: |
          set -euo pipefail
          # Mesma lista de hosts do request-dev.yml. A URL recebe o token OIDC do
          # executor e os callbacks de estado: cada uma das três Centrais promove
          # os Apps do próprio ecossistema (ADR 0010 do oon-k8s-infra).
          python3 - "$ACTIVATION_API_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit

          raw = sys.argv[1]
          if raw != raw.strip() or any(ord(ch) < 33 or ord(ch) == 127 for ch in raw):
              raise SystemExit("activation_api_url não pode conter espaços ou caracteres de controle.")
          parsed = urlsplit(raw)
          allowed_hosts = {"central-ativacao.oonapps.online", "central-ativacao-hml.oonapps.online", "central-ativacao-dev.oonapps.online"}
          if parsed.scheme != "https":
              raise SystemExit("activation_api_url deve usar HTTPS.")
          if parsed.hostname not in allowed_hosts:
              raise SystemExit("activation_api_url aponta para hostname não autorizado.")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("activation_api_url não pode conter credenciais, query ou fragment.")
          if parsed.port not in (None, 443):
              raise SystemExit("activation_api_url deve usar a porta HTTPS padrão.")
          if parsed.path.rstrip("/") != "/api":
              raise SystemExit("activation_api_url deve terminar em /api.")
          PY

      - name: Registrar falha sanitizada
        continue-on-error: true
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ACTIVATION_API_URL: ${{ inputs.activation_api_url }}
          EXECUTOR_LEASE_ID: ${{ needs.promote.outputs.lease_id }}
          EXECUTOR_OPERATION_ID: ${{ needs.promote.outputs.operation_id }}
          EXECUTOR_GENERATION: ${{ needs.promote.outputs.generation }}
        run: |
          set -euo pipefail
          separator='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && separator='&'
          audience="$(printf '%s' "$ACTIVATION_API_URL" | jq -sRr @uri)"
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${audience}" | jq -er '.value')"
          echo "::add-mask::$token"
          payload="$(jq -nc \
            --arg etapa falha_deploy \
            --arg erroCodigo PROMOTION_PIPELINE_FAILED \
            --arg erroMensagem 'Falha ao promover o digest autorizado.' \
            '{etapa:$etapa, erroCodigo:$erroCodigo, erroMensagem:$erroMensagem}')"
          if [[ -n "$EXECUTOR_OPERATION_ID" ]]; then
            payload="$(jq -c --arg leaseId "$EXECUTOR_LEASE_ID" --arg operationId "$EXECUTOR_OPERATION_ID" --arg generation "$EXECUTOR_GENERATION" '. + {leaseId:$leaseId, operationId:$operationId, generation:$generation}' <<<"$payload")"
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "x-oon-delivery-token: $token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${ACTIVATION_API_URL%/}/integracao/publicacoes/${RELEASE_ID}/estado"
